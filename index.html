<style>
  body {

  /* Dev-Links: diese Datei liegt identisch auch im GitHub-Repo - online
     sollen sie nie auftauchen. Default versteckt; JS blendet sie nur ein,
     wenn die Seite NICHT auf der Live-Domain laeuft (sicher: ohne JS bleiben sie weg). */
  .dev-link { display: none; }
</style>
</head>
<body>
  <h1>Projekte - Bernd (Sunny) Michel :</h1>
  <ul>
    <strong>   </strong>

<!-- Dev-Links - nur sichtbar, wenn die Seite nicht auf der Live-Domain laeuft -->

<!-- Link zu GitHub -->

    </li>

<!-- auf GitHub sichtbar -->

        DAS JESUS-PUZZLE<span class="desc">(Die wiederentdeckte Geschichte Jesu)</span>

    <li>
      <a href="https://isunnytt.github.io/Jesus-Puzzle.html" download data-goatcounter-click="download-jesus-puzzle">
        <span style="color: #999">Jesus-Puzzle Offline </span><span class="desc" style="color:#999">(download, open, remind no auto-updates)</span>
      </a>
    </li>
-->

  </ul>

<script>
(function () {
  // 1.) Dev-Links nur zeigen, wenn die Seite NICHT auf der Live-Domain laeuft.
  // Positiver Test auf die Domain: alles andere (localhost, file://, LAN-IP,
  // Android, Fork/Preview) gilt als nicht online. Online werden die Dev-Links
  // komplett aus dem DOM entfernt (dann greift auch "erster Link rot").
  var isOnline = location.hostname.toLowerCase() === 'isunnytt.github.io';
  document.querySelectorAll('.dev-link').forEach(function (li) {
    if (isOnline) li.remove();
    else li.classList.remove('dev-link');
  });

  // 2.) Cache-Busting per tatsaechlichem Last-Modified-Datum der Zieldatei:
  // per HEAD-Request abfragen und als Query-Parameter anhaengen. So bekommt
  // jeder Link automatisch eine neue URL, sobald sich die Zieldatei
  // aendert - ohne Versionsnummer von Hand pflegen zu muessen. Sowohl
  // Pythons http.server (lokal) als auch GitHub Pages senden den
  // Last-Modified-Header von sich aus mit.
  // Schlaegt der Request fehl (Server ohne HEAD-Unterstuetzung, CORS bei
  // Seitenaufruf von einem anderen Ursprung, offline), bleibt der Link
  // einfach unveraendert - dann greift halt wieder der normale Cache.
  document.querySelectorAll('a[data-version-check]').forEach(function (a) {
    var url = a.getAttribute('href');
    fetch(url, { method: 'HEAD', cache: 'no-store' })
      .then(function (res) {
        var lm = res.headers.get('Last-Modified');
        if (!lm) return;
        var t = new Date(lm).getTime();
        if (!isFinite(t)) return;
        var sep = url.indexOf('?') === -1 ? '?' : '&';
        a.setAttribute('href', url + sep + 't=' + t);
      })
      .catch(function () { /* Link bleibt wie er ist */ });
  });
})();
</script>
</body>
</html>
