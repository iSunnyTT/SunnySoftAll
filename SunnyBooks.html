	<style>
		:root {
			/* ==== Blätter-Effekt (Page-Flip): einstellbare Stil-Parameter ==== */
			--flip-duration: 1200ms;                              /* Dauer der Blätter-Animation (Sync mit JS: FLIP_DURATION_MS) */
			--flip-easing: cubic-bezier(0.45, 0.05, 0.15, 1);     /* Bewegungskurve der Blätter-Animation */
			--flip-perspective: 1800px;                           /* 3D-Tiefe; kleiner = staerker gewoelbt/dramatischer */
			--flip-page-bg: #fdfdfa;                              /* Papierfarbe der umblaetternden Seite */
			--flip-shadow-color: rgba(20, 15, 10, 0.45);          /* Farbe/Intensitaet des Falz-/Wende-Schattens */
			--flip-shadow-width: 42%;                             /* Breite des Schattenverlaufs an der Wendekante */
			--flip-drop-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25); /* "Abhebe"-Schatten der Seite */

			/* ==== Build-Parameter (nicht von CSS genutzt, nur von tools/build.js ausgelesen) ==== */
			--build-webp-quality: 75;                             /* WebP-Kompressionsqualitaet 0-100 fuer Hintergrundbilder */
		}
		*, *::before, *::after { box-sizing: border-box; }

		html, body { height: 100%; height: 100dvh; width: 100%; margin: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column; font-family: sans-serif; }
		#bg-container { position: fixed; top:0; left:0; width:100%; height:100%; height:100dvh; z-index: -1; background-size: cover; background-position: center; transition: opacity 3s ease-in-out; }

		header {
			flex: 0 0 auto; width: 100%; background: transparent;
			display: flex; flex-direction: column;
		}
		.header-wrapper {
			width: 100%; display: flex; align-items: center; padding: 0.2rem 16px; height: 26px;
		}
		.logo-img {
			flex-shrink: 0; width: 36px; height: 22px; object-fit: contain; margin-right: 8px;
		}
		.page-title {
			font-size: 0.7rem; font-weight: bold; text-transform: uppercase; text-align: center; width: 100%; padding-bottom: 0.2rem; margin-top: -2px;
		}

		main {
			flex: 1; overflow-y: scroll; font-size: 0.72rem; line-height: 1.4; width: 100%; padding: 0.3rem 16px 1rem; scrollbar-gutter: stable; touch-action: pan-y; 
		}
		main::-webkit-scrollbar { width: 10px; }
		main::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.5); border-radius: 5px; }
		main::-webkit-scrollbar-track { background: rgba(180,180,180,0.15); }

		.page { display: none; }
		.page.active { display: block; }
		.columns { column-count: 1; }
		.columns p { margin: 0 0 0.9em 0; }
		.columns p:last-child { margin-bottom: 0; }
		.columns p:has(> strong:only-child) { margin: 1.1em 0 0.3em 0; }
		.columns p:has(> strong:only-child):first-child { margin-top: 0; }
		.columns ul { margin: 0 0 0.9em 0; }
		.columns ul:last-child { margin-bottom: 0; }
		.columns ul { list-style-type: disc; padding-left: 12px; text-align: left; }
		/* Gruen: EINE Quelle fuer Hyperlinks und die Farbfunktion "Gruen" (jp-c3). Muss zur Palette im JS passen (cls 'jp-c3'). */
		:root { --jp-green: #2e7d32; }
		body.dark-mode { --jp-green: #6fdc74; }
		.columns a.jp-link, .columns a { font-weight: bold; color: var(--jp-green); }
		.columns p.jp-title { text-align: center; font-size: 200%; }
		/* ==== Buchformate: nummerierte Liste, Ueberschriften, Zitat, Ausrichtung, Linie, Groessen, Bilder ==== */
		.columns ol { margin: 0 0 0.9em 0; list-style-type: decimal; padding-left: 20px; text-align: left; }
		.columns ol:last-child { margin-bottom: 0; }
		.columns p.jp-h1 { font-size: 1.6em; font-weight: bold; margin: 1.1em 0 0.4em 0; }
		.columns p.jp-h2 { font-size: 1.25em; font-weight: bold; margin: 1.1em 0 0.3em 0; }
		.columns p.jp-h1:first-child, .columns p.jp-h2:first-child { margin-top: 0; }
		.columns p.jp-quote { margin-left: 1.2em; padding-left: 0.7em; border-left: 3px solid rgba(128,128,128,0.6); font-style: italic; }
		.columns .jp-al-c { text-align: center; }
		.columns .jp-al-r { text-align: right; }
		.columns .jp-al-j { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
		.columns hr { border: none; border-top: 1px solid rgba(128,128,128,0.6); margin: 0.9em 0; }
		.columns .jp-zm2 { font-size: 0.75em; }
		.columns .jp-zm1 { font-size: 0.88em; }
		.columns .jp-z1 { font-size: 1.2em; }
		.columns .jp-z2 { font-size: 1.5em; }
		.columns .jp-z3 { font-size: 2em; }
		.columns .jp-c1 { color: #c62828; }
		.columns .jp-c2 { color: #e65100; }
		.columns .jp-c3 { color: var(--jp-green); }
		.columns .jp-c4 { color: #1565c0; }
		.columns .jp-c5 { color: #6a1b9a; }
		.columns .jp-c6 { color: #757575; }
		body.dark-mode .columns .jp-c1 { color: #ff6b6b; }
		body.dark-mode .columns .jp-c2 { color: #ffa040; }
		body.dark-mode .columns .jp-c3 { color: var(--jp-green); }
		body.dark-mode .columns .jp-c4 { color: #64b5f6; }
		body.dark-mode .columns .jp-c5 { color: #c58af0; }
		body.dark-mode .columns .jp-c6 { color: #b0b0b0; }
		.columns img { max-width: 100%; height: auto; vertical-align: middle; }
		.columns img.jp-w25 { width: 25%; }
		.columns img.jp-w50 { width: 50%; }
		.columns img.jp-w75 { width: 75%; }
		.columns img.jp-w100 { width: 100%; }

		.slide-table { width: 100%; max-width: 100%; table-layout: fixed; border-collapse: collapse; }
		.slide-table td, .slide-table th { word-wrap: break-word; overflow-wrap: break-word; padding: 3px 4px; vertical-align: top; }

		footer {
			position: fixed; left: 0; bottom: 0; z-index: 450;
			height: 24px; width: 100%;
			background: transparent;
			display: flex; justify-content: center; align-items: center; gap: 1rem;
		}
		footer button { height: 24px; cursor: pointer; background: transparent; border: none; padding: 0 5px; display: flex; align-items: center; color: inherit; }
		#fsBtn { font-weight: bold; font-size: 1.05em; -webkit-text-stroke: 0.6px currentColor; }

		/* ==== Seitensprung per Long-Press auf Vor-/Zurück-Buttons ==== */
		.jp-nav-btn { position: relative; overflow: hidden; touch-action: manipulation; }
		.jp-nav-btn.jp-longpress-active::after {
			content: ""; position: absolute; inset: 0;
			background: rgba(128,128,128,0.35);
			transform-origin: left; transform: scaleX(0);
			animation: jp-fill 500ms linear forwards;
		}
		@keyframes jp-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
		.jp-page-jump-overlay {
			position: fixed; inset: 0; z-index: 500;
			background: rgba(0,0,0,0.5);
			display: flex; align-items: center; justify-content: center;
		}
		.jp-page-jump-overlay[hidden] { display: none; }
		.jp-page-jump-overlay input {
			font-size: 2rem; width: 4em; text-align: center;
			border: none; border-radius: 6px; padding: 0.2em 0;
		}

		/* ==== Dark Mode ==== */
		body.dark-mode { background: #121212; color: #e8e8e8; }
		body.dark-mode header { background: transparent; }
		body.dark-mode footer { background: transparent; color: #e8e8e8; }
		body.dark-mode main { color: #e8e8e8; }
		body.dark-mode .slide-table td, body.dark-mode .slide-table th { border-color: #666 !important; }
		body.dark-mode main::-webkit-scrollbar-thumb { background: rgba(160,160,160,0.5); }
		body.dark-mode main::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
		#langBtn { width: 1.6em; height: 1.4em; line-height: 1.4em; font-size: 0.8rem; text-align: center; padding: 0 !important; font-weight: bold; border-radius: 3px; }

		/* ==== Blätter-Effekt (Page-Flip) ==== */
		#flip-overlay {
			position: fixed; z-index: 400; pointer-events: none;
			perspective: var(--flip-perspective);
			display: none;
		}
		#flip-overlay.active { display: block; }
		.flip-leaf {
			position: absolute; top: 0; left: 0; width: 100%; height: 100%;
			background: var(--flip-page-bg);
			backface-visibility: hidden; -webkit-backface-visibility: hidden;
			transform-style: preserve-3d;
			transform: rotateY(0deg);
			transition: transform var(--flip-duration) var(--flip-easing);
			overflow: hidden;
		}
		.flip-leaf.leaf-next { transform-origin: left center; }
		.flip-leaf.leaf-prev { transform-origin: right center; }
		.flip-leaf.flip-run.leaf-next { transform: rotateY(-180deg); box-shadow: var(--flip-drop-shadow); }
		.flip-leaf.flip-run.leaf-prev { transform: rotateY(180deg); box-shadow: var(--flip-drop-shadow); }
		/* Header wird mit auf das Blatt genommen, damit Titel/Seitenzahl wie bei einer echten Buchseite mitblaettern. */
		.flip-leaf-header {
			position: absolute; top: 0; left: 0; width: 100%;
			background: transparent; box-sizing: border-box; overflow: hidden;
		}
		.flip-leaf-header-bg {
			position: absolute; inset: 0;
			background-size: cover; background-position: center; background-repeat: no-repeat;
			pointer-events: none;
		}
		.flip-leaf-header-content { position: relative; }
		.flip-leaf-body {
			position: absolute; left: 0; width: 100%; overflow: hidden;
		}
		.flip-leaf-bg {
			position: absolute; inset: 0;
			background-size: cover; background-position: center; background-repeat: no-repeat;
			pointer-events: none;
		}
		.flip-leaf-content {
			/* overflow-y:scroll + scrollbar-gutter:stable exakt wie bei main, damit die reservierte
			   Scrollbar-Breite identisch ist und der Text exakt gleich umbricht (keine eigene, sichtbare
			   Scrollbar noetig, da hier ohnehin nicht gescrollt wird - nur fuer identisches Box-Modell). */
			position: absolute; inset: 0; overflow-y: scroll; overflow-x: hidden; scrollbar-gutter: stable; box-sizing: border-box;
			line-height: 1.4; /* einheitslos, muss mit main { line-height: ... } übereinstimmen - NICHT per JS als Pixelwert setzen, sonst skaliert es bei verschachtelten groesseren Schriftgroessen (z.B. Titelseiten mit font-size:200%) nicht mit und Zeilen/Leerzeilen ruecken zusammen */
		}
		.flip-leaf-content::-webkit-scrollbar { width: 10px; }
		.flip-leaf-content::-webkit-scrollbar-thumb { background: transparent; }
		.flip-leaf-content::-webkit-scrollbar-track { background: transparent; }
		.flip-leaf-content .columns { column-count: 1; }
		.flip-leaf-content p { margin: 0 0 0.9em 0; }
		.flip-leaf-shade {
			position: absolute; inset: 0; opacity: 0; pointer-events: none;
		}
		.leaf-next .flip-leaf-shade { background: linear-gradient(to left, var(--flip-shadow-color) 0%, transparent var(--flip-shadow-width)); }
		.leaf-prev .flip-leaf-shade { background: linear-gradient(to right, var(--flip-shadow-color) 0%, transparent var(--flip-shadow-width)); }
		.flip-leaf.flip-run .flip-leaf-shade { animation: flipShade var(--flip-duration) var(--flip-easing) forwards; }
		@keyframes flipShade { 0% { opacity: 0; } 55% { opacity: 1; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.flip-leaf { transition: none !important; }
			.flip-leaf.flip-run .flip-leaf-shade { animation: none !important; }
		}
	</style>

tware ist gestattet. Das Herunterladen, Vervielfältigen, Verändern oder Weitergeben der Anwendung ist ohne ausdrückliche Genehmigung untersagt. SunnyBooks ist unentgeltlich nutzbar und wird ohne Gewähr, wie besehen (as is) bereitgestellt. Es besteht kein Anspruch auf Support, Fehlerbehebung oder fortlaufende Weiterentwicklung.&nbsp;</p><p><strong>Zwecksetzung</strong></p><p>Mein Anwendung <strong>SunnyBooks</strong> ist ein smartes Werkzeug zur Erstellung und Pflege von Büchern mit folgenden primären Vorteilen:</p><ul><li>Plattformunabhängigkeit<br>SunnyBooks ist im Browser, auf verschiedenen Betriebssystemen wie Windows, Android, Linux, ... lauffähig. Du kannst dein Buch also problemlos auf dem Smartphone, Tablet oder Computer, auch wechselweise, schreiben und unterwegs und zwischendurch daran arbeiten.</li><li>WYSIWYG<br>SunnyBooks ist ein sogenannter WYSIWXG-Editor (what you see is what you get). Editiert wird direkt im Kontext der Zielanwendung, also ohne lästiges Umschalten in einen anderen Modus, siehst du deine Änderungen direkt im Buch. </li><li>HTML-Edit<br>Du kannst die Buchseite in den HTML-Modus wechseln und so Eingaben direkt in HTML-Nomenklatur sehen und bearbeiten. So kannst du auch Funktionalität nutzen, die ich nicht über die Bedienoberfläche bereitstelle.</li><li>Schutz<br>Die Bücher werden kryptographisch mit einem Hashwert gegen unautorisierte Änderungen geschützt; der Zugriff ist passwortgeschützt. <br>Hinweis: Aber kein Schutzverfahren bietet absolute Sicherheit.</li><li>Smart<br>In den Büchern sind smarte Features fix integriert wie z.B.&nbsp; Blättern, Zoomen, Vorlesen, Hintergrund-Fading, Sprachumschaltung DE/EN. Es geht nicht darum, möglichst universelle Schriftwerke gestalten, sondern möglichst einfach den vorgegebenen Funktionsumfang = kiss "Keep it simple, stupid" nutzen zu können.</li><li>Privatprojekt&nbsp;<br>SunnyBooks ist ein nicht-kommerzielles Herzensprojekt, das ich als Hobby aber mit professionellem Anspruch betreibe, für alle die bislang den Aufwand einer Bucherstellung gescheut haben.</li></ul><p>Bedienungsanleitung und Beispiele findest du auf der nächsten Seite.</p><p><strong>Speicherung</strong></p><p>Deine Änderungen werden intern nur im nicht-permanenten Speicher gehalten. Es besteht die Gefahr dass nicht gesicherte Änderungen verlorengehen (z.B. bei Stromausfall, Browserdaten löschen, ...). Sichere die Änderungen in deinen Bücher daher regelmäßig durch Download. Aus Sicherheitsgründen speichern Browser typisch nur in fest vorgegebenen Ordnern. Von dort solltest du sie kopieren/verschieben/umbenennen je nach deinem Vorgehen. Ich zeichne keinerlei Ablage oder Aufbewahrung verantwortlich.&nbsp;</p><p><strong>Wichtiger Hinweis</strong></p><p>Mit dieser Anwendung erstellst du deine Bücher vollständig in eigener Verantwortung. Ich stelle lediglich das technische Werkzeug bereit.</p><p><strong>Inhalte</strong></p><p>Für deine Bücher bist du allein verantwortlich, ich prüfe Inhalte nicht und mache sie mir nicht zu eigen.</p><p><strong>Verwendung</strong></p><p>Wie du deine Bücher veröffentlichst oder verwertest, entscheidest du allein; alle damit verbundenen Pflichten und Risiken liegen bei dir.</p><p><strong>Gewährleistung</strong></p><p>Die Anwendung wird unentgeltlich und ohne Gewähr (§ 523 BGB) zur Verfügung gestellt. Eine Haftung für leichte Fahrlässigkeit ist ausgeschlossen.</p><p><strong>Spenden</strong></p><p>sind freiwillig und begründen keinerlei Anspruch auf Leistung, Verfügbarkeit oder Support.</p>

e.</li><li>Protection<br>Books are cryptographically protected against unauthorized changes using a hash value, and access is secured by a password. Note: However, no security method offers absolute protection.</li><li>Smart Features<br>Smart features are built right into the books—such as page turning, zooming, text-to-speech (read-aloud), background fading, and language switching (German/English). The goal isn't to create complex, universal publications, but rather to make it as easy as possible to use the provided feature set—following the KISS principle: "Keep it simple, stupid."</li><li>Personal Project<br>SunnyBooks is a non-commercial passion project—a hobby pursued with professional standards—designed for anyone who has previously shied away from the effort involved in creating a book.</li></ul><p>You can find the user manual and examples on the next page.</p><p><strong>Storage</strong></p><p>Your changes are held internally only in non-permanent storage. There is a risk that unsaved changes could be lost (e.g., due to a power outage, clearing browser data, etc.). Therefore, please save the changes to your books regularly by downloading them. For security reasons, browsers typically save files only to specific, predefined folders. You should copy, move, or rename them from there, depending on your workflow. I assume no responsibility for file storage or retention.</p><p><strong>​Important Note</strong></p><p>​You create your books using this application entirely at your own responsibility. I merely provide the technical tool.</p><p>​<strong>Content</strong></p><p>​You are solely responsible for the content of your books; I do not review contents nor do I adopt them as my own.</p><p>​<strong>Usage</strong></p><p>​You alone decide how to publish or utilize your books; all associated obligations and risks rest entirely with you.</p><p>​<strong>Warranty</strong></p><p>​The application is provided free of charge and without warranty (§ 523 BGB / German Civil Code     };
})();
