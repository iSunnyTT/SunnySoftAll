	<style>
		:root {
			/* ==== Blätter-Effekt (Page-Flip): einstellbare Stil-Parameter ==== */
			--flip-duration: 1200ms;                              /* Dauer der Blätter-Animation (Sync mit JS: FLIP_DURATION_MS) */
			--flip-easing: cubic-bezier(0.45, 0.05, 0.15, 1);     /* Bewegungskurve der Blätter-Animation */
			--flip-perspective: 1800px;                           /* 3D-Tiefe; kleiner = staerker gewoelbt/dramatischer */
			--flip-page-bg: #fdfdfa;                              /* Papierfarbe der umblaetternden Seite */
			--flip-shadow-color: rgba(20, 15, 10, 0.45);          /* Farbe/Intensitaet des Falz-/Wende-Schattens */
			--flip-shadow-width: 42%;                             /* Breite des Schattenverlaufs an der Wendekante */
			--flip-drop-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25); /* "Abhebe"-Schatten der Seite */

			/* ==== Build-Parameter (nicht von CSS genutzt, nur von tools/build.js ausgelesen) ==== */
			--build-webp-quality: 75;                             /* WebP-Kompressionsqualitaet 0-100 fuer Hintergrundbilder */
		}
		*, *::before, *::after { box-sizing: border-box; }

		html, body { height: 100%; height: 100dvh; width: 100%; margin: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column; font-family: sans-serif; }
		#bg-container { position: fixed; top:0; left:0; width:100%; height:100%; height:100dvh; z-index: -1; background-size: cover; background-position: center; transition: opacity 3s ease-in-out; }

		header {
			flex: 0 0 auto; width: 100%; background: transparent;
			display: flex; flex-direction: column;
		}
		.header-wrapper {
			width: 100%; display: flex; align-items: center; padding: 0.2rem 16px; height: 26px;
		}
		.logo-img {
			flex-shrink: 0; width: 36px; height: 22px; object-fit: contain; margin-right: 8px;
		}
		.page-title {
			font-size: 0.7rem; font-weight: bold; text-transform: uppercase; text-align: center; width: 100%; padding-bottom: 0.2rem; margin-top: -2px;
		}

		main {
			flex: 1; overflow-y: scroll; font-size: 0.72rem; line-height: 1.4; width: 100%; padding: 0.3rem 16px 1rem; scrollbar-gutter: stable; touch-action: pan-y; 
		}
		main::-webkit-scrollbar { width: 10px; }
		main::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.5); border-radius: 5px; }
		main::-webkit-scrollbar-track { background: rgba(180,180,180,0.15); }

		.page { display: none; }
		.page.active { display: block; }
		.columns { column-count: 1; }
		.columns p { margin: 0 0 0.9em 0; }
		.columns p:last-child { margin-bottom: 0; }
		.columns p:has(> strong:only-child) { margin: 1.1em 0 0.3em 0; }
		.columns p:has(> strong:only-child):first-child { margin-top: 0; }
		.columns ul { margin: 0 0 0.9em 0; }
		.columns ul:last-child { margin-bottom: 0; }
		.columns ul { list-style-type: disc; padding-left: 12px; text-align: left; }
		.columns a.jp-link, .columns a { font-weight: bold; color: green; }
		.columns p.jp-title { text-align: center; font-size: 200%; }
		/* ==== Buchformate: nummerierte Liste, Ueberschriften, Zitat, Ausrichtung, Linie, Groessen, Bilder ==== */
		.columns ol { margin: 0 0 0.9em 0; list-style-type: decimal; padding-left: 20px; text-align: left; }
		.columns ol:last-child { margin-bottom: 0; }
		.columns p.jp-h1 { font-size: 1.6em; font-weight: bold; margin: 1.1em 0 0.4em 0; }
		.columns p.jp-h2 { font-size: 1.25em; font-weight: bold; margin: 1.1em 0 0.3em 0; }
		.columns p.jp-h1:first-child, .columns p.jp-h2:first-child { margin-top: 0; }
		.columns p.jp-quote { margin-left: 1.2em; padding-left: 0.7em; border-left: 3px solid rgba(128,128,128,0.6); font-style: italic; }
		.columns .jp-al-c { text-align: center; }
		.columns .jp-al-r { text-align: right; }
		.columns .jp-al-j { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
		.columns hr { border: none; border-top: 1px solid rgba(128,128,128,0.6); margin: 0.9em 0; }
		.columns .jp-zm2 { font-size: 0.75em; }
		.columns .jp-zm1 { font-size: 0.88em; }
		.columns .jp-z1 { font-size: 1.2em; }
		.columns .jp-z2 { font-size: 1.5em; }
		.columns .jp-z3 { font-size: 2em; }
		.columns img { max-width: 100%; height: auto; vertical-align: middle; }
		.columns img.jp-w25 { width: 25%; }
		.columns img.jp-w50 { width: 50%; }
		.columns img.jp-w75 { width: 75%; }
		.columns img.jp-w100 { width: 100%; }

		.slide-table { width: 100%; max-width: 100%; table-layout: fixed; border-collapse: collapse; }
		.slide-table td, .slide-table th { word-wrap: break-word; overflow-wrap: break-word; padding: 3px 4px; vertical-align: top; }

		footer {
			position: fixed; left: 0; bottom: 0; z-index: 450;
			height: 24px; width: 100%;
			background: transparent;
			display: flex; justify-content: center; align-items: center; gap: 1rem;
		}
		footer button { height: 24px; cursor: pointer; background: transparent; border: none; padding: 0 5px; display: flex; align-items: center; color: inherit; }
		#fsBtn { font-weight: bold; font-size: 1.05em; -webkit-text-stroke: 0.6px currentColor; }

		/* ==== Seitensprung per Long-Press auf Vor-/Zurück-Buttons ==== */
		.jp-nav-btn { position: relative; overflow: hidden; touch-action: manipulation; }
		.jp-nav-btn.jp-longpress-active::after {
			content: ""; position: absolute; inset: 0;
			background: rgba(128,128,128,0.35);
			transform-origin: left; transform: scaleX(0);
			animation: jp-fill 500ms linear forwards;
		}
		@keyframes jp-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
		.jp-page-jump-overlay {
			position: fixed; inset: 0; z-index: 500;
			background: rgba(0,0,0,0.5);
			display: flex; align-items: center; justify-content: center;
		}
		.jp-page-jump-overlay[hidden] { display: none; }
		.jp-page-jump-overlay input {
			font-size: 2rem; width: 4em; text-align: center;
			border: none; border-radius: 6px; padding: 0.2em 0;
		}

		/* ==== Dark Mode ==== */
		body.dark-mode { background: #121212; color: #e8e8e8; }
		body.dark-mode header { background: transparent; }
		body.dark-mode footer { background: transparent; color: #e8e8e8; }
		body.dark-mode main { color: #e8e8e8; }
		body.dark-mode .slide-table td, body.dark-mode .slide-table th { border-color: #666 !important; }
		body.dark-mode main::-webkit-scrollbar-thumb { background: rgba(160,160,160,0.5); }
		body.dark-mode main::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
		#langBtn { width: 1.6em; height: 1.4em; line-height: 1.4em; font-size: 0.8rem; text-align: center; padding: 0 !important; font-weight: bold; border-radius: 3px; }

		/* ==== Blätter-Effekt (Page-Flip) ==== */
		#flip-overlay {
			position: fixed; z-index: 400; pointer-events: none;
			perspective: var(--flip-perspective);
			display: none;
		}
		#flip-overlay.active { display: block; }
		.flip-leaf {
			position: absolute; top: 0; left: 0; width: 100%; height: 100%;
			background: var(--flip-page-bg);
			backface-visibility: hidden; -webkit-backface-visibility: hidden;
			transform-style: preserve-3d;
			transform: rotateY(0deg);
			transition: transform var(--flip-duration) var(--flip-easing);
			overflow: hidden;
		}
		.flip-leaf.leaf-next { transform-origin: left center; }
		.flip-leaf.leaf-prev { transform-origin: right center; }
		.flip-leaf.flip-run.leaf-next { transform: rotateY(-180deg); box-shadow: var(--flip-drop-shadow); }
		.flip-leaf.flip-run.leaf-prev { transform: rotateY(180deg); box-shadow: var(--flip-drop-shadow); }
		/* Header wird mit auf das Blatt genommen, damit Titel/Seitenzahl wie bei einer echten Buchseite mitblaettern. */
		.flip-leaf-header {
			position: absolute; top: 0; left: 0; width: 100%;
			background: transparent; box-sizing: border-box; overflow: hidden;
		}
		.flip-leaf-header-bg {
			position: absolute; inset: 0;
			background-size: cover; background-position: center; background-repeat: no-repeat;
			pointer-events: none;
		}
		.flip-leaf-header-content { position: relative; }
		.flip-leaf-body {
			position: absolute; left: 0; width: 100%; overflow: hidden;
		}
		.flip-leaf-bg {
			position: absolute; inset: 0;
			background-size: cover; background-position: center; background-repeat: no-repeat;
			pointer-events: none;
		}
		.flip-leaf-content {
			/* overflow-y:scroll + scrollbar-gutter:stable exakt wie bei main, damit die reservierte
			   Scrollbar-Breite identisch ist und der Text exakt gleich umbricht (keine eigene, sichtbare
			   Scrollbar noetig, da hier ohnehin nicht gescrollt wird - nur fuer identisches Box-Modell). */
			position: absolute; inset: 0; overflow-y: scroll; overflow-x: hidden; scrollbar-gutter: stable; box-sizing: border-box;
			line-height: 1.4; /* einheitslos, muss mit main { line-height: ... } übereinstimmen - NICHT per JS als Pixelwert setzen, sonst skaliert es bei verschachtelten groesseren Schriftgroessen (z.B. Titelseiten mit font-size:200%) nicht mit und Zeilen/Leerzeilen ruecken zusammen */
		}
		.flip-leaf-content::-webkit-scrollbar { width: 10px; }
		.flip-leaf-content::-webkit-scrollbar-thumb { background: transparent; }
		.flip-leaf-content::-webkit-scrollbar-track { background: transparent; }
		.flip-leaf-content .columns { column-count: 1; }
		.flip-leaf-content p { margin: 0 0 0.9em 0; }
		.flip-leaf-shade {
			position: absolute; inset: 0; opacity: 0; pointer-events: none;
		}
		.leaf-next .flip-leaf-shade { background: linear-gradient(to left, var(--flip-shadow-color) 0%, transparent var(--flip-shadow-width)); }
		.leaf-prev .flip-leaf-shade { background: linear-gradient(to right, var(--flip-shadow-color) 0%, transparent var(--flip-shadow-width)); }
		.flip-leaf.flip-run .flip-leaf-shade { animation: flipShade var(--flip-duration) var(--flip-easing) forwards; }
		@keyframes flipShade { 0% { opacity: 0; } 55% { opacity: 1; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.flip-leaf { transition: none !important; }
			.flip-leaf.flip-run .flip-leaf-shade { animation: none !important; }
		}
	</style>

<p class="jp-title"><strong><br>SunnyBooks<br>-<br>Kein Buch geladen: bitte "Upload" oder neue Seite</strong></p><p><br></p><p><strong style="font-size: 0.72rem;">(C)OPYRIGHT&nbsp;</strong><span style="font-size: 0.72rem;">(C) 2026 Bernd (Sunny) Michel</span></p><p>Die Online-Nutzung dieser Software ist gestattet. Das Herunterladen, Vervielfältigen, Verändern oder weitergeben der Anwendung ist ohne ausdrückliche Genehmigung untersagt.</p><p><strong>Dein Buch</strong></p><p><span style="font-size: 0.72rem;">Wenn Du mit meinen SunnyBooks (Master/Editor) ein eigenes Buch erstellen möchtest,&nbsp;</span><span style="font-size: 0.72rem;">solltest Du:&nbsp;</span></p><ul><li>mir zumindest einen virtuellen Kaffee als Dankeschön und Motivation spendieren:<br><span style="color: rgb(0, 128, 0); font-weight: 700; text-decoration: underline;">https://www.ko-fi.com/berndmichel</span></li><li>eine Email an <a class="jp-link" href="mailto:bernd.michel@a-b-see.de" target="_blank" rel="noopener noreferrer">bernd.michel@a-b-see.de</a> schreiben unter Angabe von Datei-/Buchname (&lt;20 und keine Sonderzeichen) und Kopfzeilentext (&lt;40 Zeichen) in DE und EN also z.B. "MES-Buch" "Mein erstes sonniges Büchlein" "My first tiny sunny book";<br>Achtung: Kopfzeile nicht mehr von Dir änderbar!</li><li>dann sende ich Dir ein initiales Buch mit individuellem Passwort.</li></ul><p><strong>Zwecksetzung</strong></p><p>Mein Anwendung SunnyBooks ist ein smartes Werkzeug zur Erstellung und Pflege von Büchern im Browser, d.h. D.h. sowohl online als auch offline auf verschiedenen Betriebssystemen wie Windows, Android, Linux, ... lauffähig.&nbsp;<br>Die Besonderheit von SunnyBooks ist nicht nur diese Plattform-Unabhängigkeit, sondern die sogenannte wysiwyg-Eigenschaft (what you see is what you get). Editiert wird direkt im Kontext der Zielanwendung, also ohne lästiges Umschalten in einen anderen Modus. Die gespeicherten Bücher sind eine Untermenge des Anwendungsumfanges von SunnyBooks und mittels Hash und individuellem Passwort gesichert.<br>Mein Fokus war und ist dabei in den Büchern integrierte smarte Features wie Blättern, Zoomen, Vorlesen, Hintergrundbilder mit Fading, ... in den Sprachen DE/EN bereitzustellen. Mit SunnyBooks geht es nicht darum möglichst universelle Schriftwerke zu gestalten, sondern möglichst einfach und simpel den vorgegebenen Funktionsumfang = KISS "Keep it simple, stupid".<br>SunnyBooks wurde ursprünglich nur für meine eigenen Zwecke von mir entwickelt und ich biete es nur als Hobby online zur Nutzung an.</p><p><strong>Wichtiger Hinweis</strong></p><p>Mit dieser Anwendung erstellst du deine Bücher vollständig in eigener Verantwortung. Ich stelle lediglich das technische Werkzeug bereit.</p><p><strong>Inhalte</strong></p><p>Für deine Bücher bist du allein verantwortlich, ich prüfe Inhalte nicht und mache sie mir nicht zu eigen.</p><p><strong>Speicherung</strong></p><p>Es besteht kein Anspruch auf Ablage oder Aufbewahrung. Sichere deine Bücher regelmäßig durch Download.</p><p><strong>Verwendung</strong></p><p>Wie du deine Bücher veröffentlichst oder verwertest, entscheidest du allein; alle damit verbundenen Pflichten und Risiken liegen bei dir.</p><p><strong>Gewährleistung</strong></p><p>Die Anwendung wird unentgeltlich und ohne Gewähr (§ 523 BGB) zur Verfügung gestellt. Eine Haftung für leichte Fahrlässigkeit ist ausgeschlossen.</p><p><strong>Spenden</strong></p><p>sind freiwillig und begründen keinerlei Anspruch auf Leistung, Verfügbarkeit oder Support.</p><p><strong>MINI-BEDIENANLEITUNG (Editor)</strong></p><p><strong>Buttons (Rechts):</strong></p><ul><li>Upload (Laden eines Buch um es zu ändern)</li><li>Download (Sicherung des Buch als .html)</li><li>+ (Einfügen Seite, mit Abfrage Titel, Referenz, Seitennummer)</li><li>= (Änderung Seite: Titel, Referenz, Seitennummer)</li><li>- (Löschung Seite)</li><li>Rückgängig (↶) / Wiederholen (↷)</li><li>HTML-Modus (&lt;&gt;): HTML der Seite bearbeiten</li><li>Link zu Seite (Seitensymbol) für markierten Text</li><li>Link zu Web (Weltkugel) für markierten Text</li><li>Hintergrundbild der Seite wählen / ändern / entfernen</li><li>Bild in Text einfügen (Dateiauswahl, wird verkleinert, Antippen des Bilds 25 / 50 / 75 / 100 %)</li><li>Absatz Einfügen</li><li>Zeilenumbruch Einfügen</li><li>Schrift kleiner (A−) / größer (A+) – für den markierten Text, stufenweise</li><li>Ausrichtung: links → zentriert → rechts → Blocksatz</li><li>Überschrift (Ü): normal → groß → mittel → normal</li><li>Zitatblock (“)</li><li>Liste (Aufzählung)</li><li>Nummerierte Liste (1.)</li><li>Trennlinie (―)</li><li>Fett, Kursiv, Unterstrichen, Durchgestrichen, Hochgestellt (x²), Tiefgestellt (x₂) – für den markierten Text (Strg+B/I/U am PC)</li><li>Formatierung entfernen (Tx)</li></ul><p><strong>MINI-BEDIENANLEITUNG (Bücher)</strong></p><p><strong>Buttons (Fußzeile):</strong></p><ul><li>Vorherige Seite (click) bzw. Seiteneingabe (long press)</li><li>Vollbild</li><li>Modus (Light/Dark) und Sprache (DEutsch/ENglisch)</li><li>Nächste Seite (click) bzw. Seiteneingabe (long press)</li></ul><p><strong>Gesten:</strong></p><ul style="margin: 0px;"><li>Wischen (horizontal)</li><li>Scrollen (vertikal)</li><li>Zoomen (zwei Finger)</li></ul><p><br></p>

<p class="jp-title"><strong><br>SunnyBooks<br>-<br>No book loaded: please use "Upload" or New Page</strong></p><p><br></p><p><strong style="font-size: 0.72rem;">(C)OPYRIGHT </strong><span style="font-size: 0.72rem;">(C) 2026 Bernd (Sunny) Michel</span></p><p>​Online use of this software is permitted. Downloading, duplicating, modifying, or redistributing the application without express permission is prohibited.</p><p><strong>Your Book</strong></p><p class="MsoNormal"><span style="font-size: 0.72rem;">If you would like to create your own book using my SunnyBooks (Master/Editor), you should:</span></p><ul><li>buy me at least a virtual coffee as a thank-you and source of motivation:<br><span style="color: rgb(0, 128, 0); font-weight: 700; text-decoration: underline;">https://www.ko-fi.com/berndmichel</span></li><li>send an email to <strong><a class="jp-link" href="mailto:bernd.michel@a-b-see.de" target="_blank" rel="noopener noreferrer">bernd.michel@a-b-see.de</a></strong> with filename (&lt;20 standard characters) and header title (&lt;40 characters) in DE and EN so e.g. "MFS-Book" "Mein erstes sonniges Büchlein" "My first tiny Sunny Book";<br>Attention: header cannot be changed later on by you !</li><li>then I will send you a initial book with a unique password.</li></ul><p><strong>Purpose</strong></p><p>​My application <strong>SunnyBooks</strong> is a smart tool for creating and maintaining books in the browser, meaning it runs both online and offline across various operating systems such as Windows, Android, Linux, etc.</p><p>​The special feature of SunnyBooks is not only this platform independence, but also its WYSIWYG property (What You See Is What You Get). Editing takes place directly within the context of the target application, eliminating the need to switch back and forth between modes. Saved books are a subset of the SunnyBooks application scope and are secured using a hash and an individual password.&nbsp;<br>My focus has been and continues to be providing smart features integrated into the books—such as page-turning, zooming, read-aloud, background images with fading, etc.—in both German and English. SunnyBooks is not intended to create universally complex publications, but rather to provide the defined set of features as easily and simply as possible&nbsp;= KISS "Keep it simple, stupid".<br>SunnyBooks was originally developed solely for my own personal use, and I offer it online as a hobby project.</p><p><strong>​Important Note</strong></p><p>​You create your books using this application entirely at your own responsibility. I merely provide the technical tool.</p><p>​<strong>Content</strong></p><p>​You are solely responsible for the content of your books; I do not review contents nor do I adopt them as my own.</p><p>​<strong>Storage</strong></p><p>​There is no entitlement to storage or retention of your data. Please back up your books regularly by downloading them.</p><p>​<strong>Usage</strong></p><p>​You alone decide how to publish or utilize your books; all associated obligations and risks rest entirely with you.</p><p>​<strong>Warranty</strong></p><p>​The application is provided free of charge and without warranty (§ 523 BGB / German Civil Code). Liability for slight negligence is excluded.</p><p>​<strong>Donations</strong></p><p>​Donations are voluntary and do not establish any claim to performance, availability, or support.</p><p><strong>QUICK START GUIDE (Editor)</strong></p><p><strong>Buttons (Right):</strong></p><ul><li>Upload (Load a Book for edit)</li><li>Download (Save Book)</li><li>+ (Insert Page, with title, id, slide number)</li><li>= (Modify Page: title, id, slide number)</li><li>- (Delete Page)</li><li>Undo (↶) / Redo (↷)</li><li>HTML mode (&lt;&gt;): edit the page's HTML</li><li>Link to page (page symbol) for the selected text</li><li>Link to web (globe) for the selected text</li><li>Choose / change / remove the page's background image</li><li>Insert image into text (file picker, gets downscaled, tapping the image 25 / 50 / 75 / 100 %)</li><li>Paragraph Insert</li><li>CR/LF Insert</li><li>Font smaller (A−) / larger (A+) – for the selected text, in steps</li><li>Alignment: left → centered → right → justified</li><li>Heading (Ü): normal → large → medium → normal</li><li>Quote block (“)</li><li>List (bullets)</li><li>Numbered list (1.)</li><li>Horizontal rule (―)</li><li>Bold, Italic, Underline, Strikethrough, Superscript (x²), Subscript (x₂) – for the selected text (Ctrl+B/I/U on PC)</li><li>Clear formatting (Tx)</li></ul><p><strong>QUICK START GUIDE (Books)</strong></p><p><strong>Buttons (Footer):</strong></p><ul><li>Previous page (click) / page Number (long press)</li><li>Full screen</li><li>Mode (Light/Dark) und Language (German/English)</li><li>Next page (click) / page Number (long press)</li></ul><p><strong>Gestures:</strong></p><ul><li>Swipe (horizontal)</li><li>Scroll (vertical)</li><li>Zoom (two fingers)</li></ul><p></p>

<script id="jp-capture-script">

// Laufzeit-/Editorzustand (contenteditable, gerenderter Header, ...) im Buch.
window.JP_EDIT_MODE = true;
(function () {
    function attrs(el) {
