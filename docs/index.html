  <script>
    // Liest die Versionskennung live aus den letzten Bytes der Jesus-Puzzle.html
    // (per HTTP-Range-Anfrage, ohne die komplette - u.U. sehr grosse - Datei zu laden).
    // Der Marker liegt bewusst im Hash-geschuetzten Bereich am Dateiende.
    async function loadVersion(url) {
      try {
        const res = await fetch(url, { headers: { Range: 'bytes=-32768' } });
        const text = await res.text();
        const m = text.match(/V1234567([^"]*)"/);
        if (!m || !m[1]) return;
        const full = m[1];
        const ver = full.length >= 8 ? full.slice(-8) : full;
        const vJesus = document.getElementById('verJesus');
        if (vJesus) vJesus.textContent = ver;
      } catch (e) {
        // Links funktionieren auch ohne Versionsanzeige
      }
    }     
    loadVersion('https://isunnytt.github.io/SunnySoftAll/Jesus-Puzzle/Jesus-Puzzle.html');
  </script>
